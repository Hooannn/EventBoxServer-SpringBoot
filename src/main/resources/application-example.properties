# Copy this file to application.properties and replace the example values with your local settings.
# DataSource configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/example_database
spring.datasource.username=example_user
spring.datasource.password=example_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Email configuration
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=example@smtp.example.com
spring.mail.password=example_smtp_password
spring.mail.properties.from-name=Example Support
spring.mail.properties.from-address=noreply@example.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=example_redis_password

# Rate limit config
application.rate-limit.requests-per-minute=1000
application.rate-limit.window-seconds=60

# Logging configuration
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.actuate.web=DEBUG

# Security config
application.security.jwt.qrcode-secret-key=example_qrcode_secret_key
application.security.jwt.access-secret-key=example_access_secret_key
application.security.jwt.access-secret-key-path=classpath:certs/access_token_private.pem
application.security.jwt.access-public-key-path=classpath:certs/access_token_public.pem
application.security.jwt.refresh-secret-key=example_refresh_secret_key
application.security.jwt.expiration=900000
application.security.jwt.refresh.expiration=604800000
application.security.jwt.password.expiration=600000
application.security.jwt.qrcode.expiration=300000

# Cors config
application.security.public-apis-prefix=/public/api/v1/,/api/v1/auth/,/api/v2/auth/,/api/v1/orders/paypal/webhook/,/actuator
application.security.cors.allowed-origins=http://localhost:5173,https://example-frontend.local
application.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
application.security.cors.allowed-headers=Authorization,Content-Type,X-Device-Id
application.security.cors.allow-credentials=true

# Cookies config
application.security.cookies.http-only=true
application.security.cookies.secure=true
application.security.cookies.same-site=Lax
application.security.cookies.refresh-token-path=/api/v1/auth/refresh
application.security.cookies.access-token-path=/api

# Web client configuration
client.web.url=http://127.0.0.1:5173

# PayPal config
paypal.client-id=example_paypal_client_id
paypal.client-secret=example_paypal_client_secret
paypal.checkout.webhook.id=example_checkout_webhook_id
paypal.payment.webhook.id=example_payment_webhook_id

exchange.api.key=example_exchange_api_key
amdoren.api.key=example_amdoren_api_key

root.user.email=root@example.com
root.user.password=example_root_password
root.role.name=root
root.role.description=Root role of the system
root.role.permissions=read:*,create:*,delete:*,update:*

socket-server.host=localhost
socket-server.port=3000

# Cloudinary config
cloudinary.cloud-name=example_cloud_name
cloudinary.api-key=example_cloudinary_api_key
cloudinary.api-secret=example_cloudinary_api_secret

# AI Sentiment Analysis API URL
sentiment.service.api.base.url=http://localhost:8000

# Application eventbox config
eventbox.bootstrap.enabled=true
eventbox.config.access-organizer-permission=create:organizations
eventbox.config.access-admin-permission=access:admin
jobrunr.background-job-server.enabled=true
jobrunr.dashboard.enabled=true
jobrunr.database.skip-create=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=eventbox
